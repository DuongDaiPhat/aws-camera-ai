[project]
name = "camerai-ai-service"
version = "0.0.1"
description = "FastAPI service cho module AI: M1 face, M2a pose/fall, M3 fire/smoke"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.12",
    "Pillow>=11.0.0",
    "opencv-python-headless==4.10.0.84",
]

[project.optional-dependencies]
# Cai rieng o Sprint 2/3 — nang, khong dua vao base de CI chay nhanh
m1 = ["face-recognition>=1.3.0", "opencv-python-headless>=4.10.0"]
m2a = ["mediapipe>=0.10.14", "opencv-python-headless>=4.10.0"]
m3 = ["ultralytics>=8.3.0"]
aws = ["boto3>=1.35.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.9",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------- Ruff (lint + format, thay cho flake8 + black) ----------------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # simplify
    "C90", # mccabe complexity
]
ignore = ["E501"] # do formatter lo

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ---------------- pytest ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"
pythonpath = ["."]

[tool.coverage.report]
# DoD: coverage core logic >= 60% (NFR-07)
fail_under = 60
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

# ---------------- mypy ----------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
