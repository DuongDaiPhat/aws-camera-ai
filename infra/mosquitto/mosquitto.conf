# Mosquitto - cau hinh DEV (khong bao mat, chi dung trong docker network noi bo)
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

