# Webcam trinh duyet publish qua WHIP voi token ngan han do Orchestrator cap.
# Video upload duoc Source Runner publish RTSP voi tai khoan noi bo.
# Lenh FFmpeg thu cong vao duong dan camera RTSP se bi authHTTPAddress tu choi.

logLevel: info
rtspAddress: :8554
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
hlsAddress: :8888

# Each browser WHIP publish must present its short-lived camera-bound token.
authMethod: http
authHTTPAddress: http://orchestrator:3001/api/v1/mediamtx/authorize
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

paths:
  cam_living_room:
    source: publisher
  cam_kitchen:
    source: publisher
  cam_test:
    source: publisher
