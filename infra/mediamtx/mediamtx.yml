# mediamtx - gia lap camera RTSP (task 0.6)
# Publish webcam len luong:
#   ffmpeg -f dshow -i video="<ten webcam>" -c:v libx264 -preset ultrafast \
#          -tune zerolatency -f rtsp rtsp://localhost:8554/cam_living_room
# Publish file mp4 (dung cho dataset te nga / chay khoi) lap vo han:
#   ffmpeg -re -stream_loop -1 -i fall_01.mp4 -c copy -f rtsp rtsp://localhost:8554/cam_test

logLevel: info
rtspAddress: :8554
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
hlsAddress: :8888

# Each browser WHIP publish must present its short-lived camera-bound token.
authMethod: http
authHTTPAddress: http://orchestrator:3001/api/v1/mediamtx/authorize
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

paths:
  cam_living_room:
    source: publisher
  cam_kitchen:
    source: publisher
  cam_test:
    source: publisher
