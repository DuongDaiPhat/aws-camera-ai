# Local US-18 acceptance on the existing application and its persistent data.
# docker compose -f docker-compose.yml -f infra/dev/compose.us18-webcam.yml --profile cv up -d --build
# Telegram delivery stays disabled until the operator authorizes a new live test.
services:
  web:
    environment:
      WATCHPACK_POLLING: "true"
  ai-service:
    environment:
      M3_ENABLED: "true"
      FIRE_MODEL_PATH: /app/models/fire-smoke-yolo26n-checkpoint-nms-v2.onnx
      FIRE_MODEL_VERSION: fire-smoke-yolo26n-checkpoint-nms-v2
      FIRE_MODEL_SHA256: 2d21e8c8278c2887f3a8e1c0eca4b78218781b9124ce0c5969f5107eab77959c
  orchestrator:
    environment:
      M3_ENABLED: "true"
      TELEGRAM_ENABLED: "false"
      FIRE_MODEL_VERSION: fire-smoke-yolo26n-checkpoint-nms-v2
      AI_SERVICE_URL: http://ai-service:8000
      MINIO_PUBLIC_ENDPOINT: http://localhost:${PORT_MINIO_API:-9000}
  frigate:
    environment:
      FRIGATE_FIRE_FRAMES_ENABLED: "true"
